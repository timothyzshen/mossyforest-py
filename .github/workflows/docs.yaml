name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the documentation tools
        run: python -m pip install mkdocs-material "mkdocstrings[python]"

      - name: Build and publish to the gh-pages branch
        run: mkdocs gh-deploy --force
